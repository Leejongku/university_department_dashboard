<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>타 대학 전산팀 기획·개발·운영·AI 조직도 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d18;--surf:#0f1623;--card:#131c2e;--border:#1a2640;
  --plan:#6366f1;--dev:#10b981;--ops:#f59e0b;--ai:#e879f9;
  --plan-bg:rgba(99,102,241,.12);--dev-bg:rgba(16,185,129,.12);
  --ops-bg:rgba(245,158,11,.12);--ai-bg:rgba(232,121,249,.12);
  --plan-bd:rgba(99,102,241,.35);--dev-bd:rgba(16,185,129,.35);
  --ops-bd:rgba(245,158,11,.35);--ai-bd:rgba(232,121,249,.35);
  --text:#e2e8f0;--muted:#64748b;--head-h:130px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}

/* ── header ── */
.hdr{background:linear-gradient(160deg,#080d18 0%,#0b1628 60%,#080d18 100%);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;
  padding:20px 36px 16px;}
.hdr h1{font-size:18px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(90deg,#e2e8f0,#818cf8,#34d399,#fbbf24,#e879f9);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px;}
.tabs{display:flex;flex-wrap:wrap;gap:5px;}
.tab{padding:5px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--surf);color:var(--muted);transition:all .18s;}
.tab:hover{border-color:#6366f1;color:var(--text);}
.tab.active{background:#6366f1;border-color:#6366f1;color:#fff;box-shadow:0 0 10px rgba(99,102,241,.4);}

/* ── legend ── */
.legend{display:flex;gap:12px;align-items:center;padding:14px 36px;
  border-bottom:1px solid var(--border);flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;}
.leg-dot{width:10px;height:10px;border-radius:50%;}

/* ── main ── */
.main{max-width:1380px;margin:0 auto;padding:28px 36px 60px;}
.panel{display:none;animation:fadeUp .3s ease;}
.panel.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── panel header ── */
.ph{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px;
  padding-bottom:20px;border-bottom:1px solid var(--border);}
.ph-left .uni{font-size:28px;font-weight:900;letter-spacing:-1px;}
.ph-left .dept{font-size:13px;color:#67e8f9;margin-top:5px;
  background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.25);
  display:inline-block;padding:3px 12px;border-radius:20px;}
.ph-cats{margin-left:auto;display:flex;gap:10px;}
.cat-pill{text-align:center;padding:8px 16px;border-radius:10px;min-width:72px;}
.cat-pill .n{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;line-height:1;}
.cat-pill .l{font-size:10px;margin-top:2px;font-weight:600;letter-spacing:.5px;}
.cp-plan{background:var(--plan-bg);border:1px solid var(--plan-bd);color:var(--plan);}
.cp-dev {background:var(--dev-bg); border:1px solid var(--dev-bd); color:var(--dev);}
.cp-ops {background:var(--ops-bg); border:1px solid var(--ops-bd); color:var(--ops);}
.cp-ai  {background:var(--ai-bg);  border:1px solid var(--ai-bd);  color:var(--ai);}

/* ── team grid ── */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.team-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;
  transition:transform .2s,box-shadow .2s,border-color .2s;}
.team-card:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(0,0,0,.5);border-color:rgba(99,102,241,.35);}
.tc-hdr{padding:13px 16px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);}
.tc-name{font-size:14px;font-weight:700;}
.tc-badges{display:flex;gap:5px;}
.badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:4px;}
.b-plan{background:var(--plan-bg);color:var(--plan);border:1px solid var(--plan-bd);}
.b-dev {background:var(--dev-bg); color:var(--dev); border:1px solid var(--dev-bd);}
.b-ops {background:var(--ops-bg); color:var(--ops); border:1px solid var(--ops-bd);}
.b-ai  {background:var(--ai-bg);  color:var(--ai);  border:1px solid var(--ai-bd);}

/* ── category sections ── */
.tc-body{padding:10px 14px 14px;}
.cat-sec{margin-bottom:8px;}
.cat-sec:last-child{margin-bottom:0;}
.cat-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  display:flex;align-items:center;gap:5px;margin-bottom:5px;}
.cat-label::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;}
.cl-plan{color:var(--plan);}
.cl-plan::before{background:var(--plan);}
.cl-dev {color:var(--dev);}
.cl-dev::before{background:var(--dev);}
.cl-ops {color:var(--ops);}
.cl-ops::before{background:var(--ops);}
.cl-ai  {color:var(--ai);}
.cl-ai::before{background:var(--ai);}

.task-list{display:flex;flex-direction:column;gap:3px;}
.task{font-size:11.5px;color:#94a3b8;line-height:1.5;padding:2px 0 2px 10px;
  border-left:2px solid var(--border);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:default;}
.task:hover{color:var(--text);white-space:normal;}
.more-btn{font-size:10px;color:var(--muted);cursor:pointer;margin-top:3px;
  padding:2px 8px;border-radius:4px;background:var(--surf);border:none;
  transition:color .15s;}
.more-btn:hover{color:var(--text);}

/* ── AI highlight ── */
.ai-badge{display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;
  background:var(--ai-bg);color:var(--ai);border:1px solid var(--ai-bd);
  margin-left:6px;}
.ai-star::before{content:'✦ ';}

/* ── no-data ── */
.no-data{color:var(--muted);font-size:12px;padding:4px 0 4px 10px;}

/* AI note box */
.ai-note{background:var(--ai-bg);border:1px solid var(--ai-bd);border-radius:8px;
  padding:12px 16px;margin-bottom:20px;font-size:12px;color:var(--ai);
  display:none;}
.ai-note.show{display:block;}
.ai-note strong{display:block;margin-bottom:4px;font-size:13px;}

@media(max-width:768px){
  .hdr,.main{padding-left:16px;padding-right:16px;}
  .legend{padding-left:16px;}
  .ph{flex-direction:column;}
  .ph-cats{margin-left:0;width:100%;}
  .cat-pill{flex:1;}
}
</style>
</head>

const UNI_ORDER=['서울대','연세대','고려대','성균관대','중앙대','경희대','건국대','동국대','홍익대','숭실대','세종대','인하대'];
const CATS=['기획','개발','운영','AI'];
const CC={기획:'plan',개발:'dev',운영:'ops','AI':'ai'};

function renderTabs(){
  const el=document.getElementById('tabs');
  UNI_ORDER.forEach((u,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===0?' active':'');
    b.textContent=u; b.dataset.id=u;
    b.onclick=()=>show(u);
    el.appendChild(b);
  });
}

function show(uni){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('p-'+uni).classList.add('active');
  document.querySelector(`.tab[data-id="${uni}"]`).classList.add('active');
}

function catPill(cat,n){
  if(!n) return '';
  const c=CC[cat];
  return `<div class="cat-pill cp-${c}"><div class="n">${n}</div><div class="l">${cat==='AI'?'★ AI':cat}</div></div>`;
}

function catSection(cat,items){
  if(!items||!items.length) return '';
  const c=CC[cat];
  const MAX=4;
  const shown=items.slice(0,MAX);
  const rest=items.slice(MAX);
  const id='s'+Math.random().toString(36).slice(2);
  let html=`<div class="cat-sec">
    <div class="cat-label cl-${c}">${cat==='AI'?'★ AI':cat} <span style="opacity:.5;font-size:9px;">(${items.length})</span></div>
    <div class="task-list">`;
  shown.forEach(t=>{html+=`<div class="task" title="${t.replace(/"/g,'&quot;')}">${t}</div>`;});
  if(rest.length){
    html+=`<button class="more-btn" onclick="toggleMore('${id}',this)">▸ ${rest.length}개 더보기</button>
    <div id="${id}" style="display:none;"><div class="task-list">`;
    rest.forEach(t=>{html+=`<div class="task" title="${t.replace(/"/g,'&quot;')}">${t}</div>`;});
    html+=`</div></div>`;
  }
  html+=`</div></div>`;
  return html;
}

function toggleMore(id,btn){
  const el=document.getElementById(id);
  if(el.style.display==='none'){el.style.display='block';btn.textContent='▾ 접기';}
  else{el.style.display='none';btn.textContent=btn.textContent.replace('▾','▸').replace('접기',`${parseInt(btn.textContent)||''}개 더보기`);}
}

function buildTeamCard(teamName,teamData){
  // badges
  let badges='';
  CATS.forEach(cat=>{
    if(teamData[cat]&&teamData[cat].length) badges+=`<span class="badge b-${CC[cat]}">${cat==='AI'?'AI':cat} ${teamData[cat].length}</span>`;
  });
  // sections
  let sections='';
  CATS.forEach(cat=>{if(teamData[cat]) sections+=catSection(cat,teamData[cat]);});
  if(!sections) sections='<div class="no-data">분류된 업무 없음</div>';
  return `<div class="team-card">
    <div class="tc-hdr">
      <span class="tc-name">${teamName}</span>
      <div class="tc-badges">${badges}</div>
    </div>
    <div class="tc-body">${sections}</div>
  </div>`;
}

function buildPanel(uni){
  const d=D[uni]; if(!d) return '';
  const tot=d.totals||{};
  const hasAI=tot['AI']>0;
  // AI note
  let aiNote='';
  if(hasAI){
    const aiItems=[];
    Object.entries(d.teams).forEach(([t,td])=>{if(td.AI)td.AI.forEach(i=>aiItems.push(`[${t}] ${i}`));});
    aiNote=`<div class="ai-note show">
      <strong>✦ AI 관련 업무 감지 (${tot['AI']}건)</strong>
      ${aiItems.map(i=>`<div style="margin-top:2px;opacity:.85;">• ${i}</div>`).join('')}
    </div>`;
  }
  // pills
  let pills='';
  CATS.forEach(cat=>{if(tot[cat]) pills+=catPill(cat,tot[cat]);});
  // team cards
  let cards='';
  Object.entries(d.teams).forEach(([t,td])=>{cards+=buildTeamCard(t,td);});
  return `<div class="ph">
    <div class="ph-left">
      <div class="uni">${uni}${hasAI?'<span class="ai-badge">✦ AI</span>':''}</div>
      <div class="dept">${d.dept}</div>
    </div>
    <div class="ph-cats">${pills}</div>
  </div>
  ${aiNote}
  <div class="team-grid">${cards}</div>`;
}

function renderPanels(){
  const main=document.getElementById('main');
  UNI_ORDER.forEach((u,i)=>{
    const d=document.createElement('div');
    d.className='panel'+(i===0?' active':'');
    d.id='p-'+u;
    d.innerHTML=buildPanel(u);
    main.appendChild(d);
  });
}

renderTabs();
renderPanels();
</script>
