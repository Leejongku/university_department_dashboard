<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타 대학 전산팀 운영 현황 조직도 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0b0f1a;
  --surface:   #111827;
  --card:      #161d2e;
  --border:    #1e2d45;
  --accent:    #3b82f6;
  --accent2:   #06b6d4;
  --accent3:   #8b5cf6;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --total-bg:  #1e3a5f;
  --dept-bg:   #162032;
  --tag-총괄:  #3b82f6;
  --tag-기획:  #8b5cf6;
  --tag-공통:  #06b6d4;
  --tag-인프라:#0ea5e9;
  --tag-LMS:   #10b981;
  --tag-학사:  #f59e0b;
  --tag-행정:  #ef4444;
  --tag-연구:  #ec4899;
  --tag-기타:  #6b7280;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, #0b0f1a 0%, #0f1f3d 50%, #0b0f1a 100%);
  border-bottom: 1px solid var(--border);
  padding: 32px 40px 28px;
  position: sticky; top:0; z-index:100;
  backdrop-filter: blur(12px);
}
.header-inner { max-width: 1400px; margin:0 auto; }
.header-top { display:flex; align-items:flex-end; gap:16px; margin-bottom:20px; }
.header h1 {
  font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
  background: linear-gradient(90deg, #e2e8f0, #93c5fd, #67e8f9);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header .year {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; color: var(--accent2);
  background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.3);
  padding: 3px 10px; border-radius: 4px; margin-bottom: 4px;
}

/* ── 대학 탭 ── */
.tabs {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.tab {
  padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted);
  transition: all 0.2s;
}
.tab:hover { border-color: var(--accent); color: var(--text); }
.tab.active {
  background: var(--accent); border-color: var(--accent);
  color: #fff; box-shadow: 0 0 12px rgba(59,130,246,0.4);
}

/* ── Main ── */
.main { max-width: 1400px; margin: 0 auto; padding: 36px 40px 60px; }

/* ── 조직도 패널 ── */
.org-panel { display: none; }
.org-panel.active { display: block; animation: fadeUp 0.35s ease; }
@keyframes fadeUp {
  from { opacity:0; transform: translateY(12px); }
  to   { opacity:1; transform: translateY(0); }
}

/* ── 패널 헤더 ── */
.panel-header {
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 28px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.panel-univ { font-size: 26px; font-weight: 900; letter-spacing: -1px; }
.panel-dept {
  font-size: 14px; color: var(--accent2);
  background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.25);
  padding: 4px 12px; border-radius: 20px;
}
.panel-total {
  margin-left: auto;
  font-family: 'IBM Plex Mono', monospace;
  text-align: right;
}
.panel-total .num {
  font-size: 36px; font-weight: 700; color: var(--accent);
  line-height: 1;
}
.panel-total .label { font-size: 11px; color: var(--muted); margin-top:2px; }

/* ── 총계 바 ── */
.summary-bar {
  background: var(--total-bg);
  border: 1px solid rgba(59,130,246,0.3);
  border-radius: 10px; padding: 16px 24px;
  margin-bottom: 24px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.summary-bar .bar-label {
  font-size: 11px; font-weight: 700; color: var(--accent);
  letter-spacing: 1px; text-transform: uppercase;
  margin-right: 8px; white-space: nowrap;
}
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
  white-space: nowrap;
}
.tag .cnt { font-family: 'IBM Plex Mono', monospace; }

/* ── 부서 그리드 ── */
.dept-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

/* ── 부서 카드 ── */
.dept-card {
  background: var(--dept-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.dept-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  border-color: rgba(59,130,246,0.4);
}
.dept-card-header {
  padding: 14px 18px 10px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.dept-name {
  font-size: 14px; font-weight: 700; letter-spacing: -0.3px;
}
.dept-total {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 18px; font-weight: 700; color: var(--accent);
}
.dept-total span { font-size: 11px; color: var(--muted); margin-left:2px; }

.dept-tags {
  padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 6px;
}

/* ── 업무 비율 바 ── */
.dept-bar {
  height: 4px; width: 100%; display: flex; overflow: hidden;
}
.dept-bar-seg { transition: width 0.6s ease; }

/* 색상 */
.c-총괄  { background: var(--tag-총괄); }
.c-기획  { background: var(--tag-기획); }
.c-공통  { background: var(--tag-공통); }
.c-인프라{ background: var(--tag-인프라);}
.c-LMS   { background: var(--tag-LMS);  }
.c-학사  { background: var(--tag-학사); }
.c-행정  { background: var(--tag-행정); }
.c-연구  { background: var(--tag-연구); }
.c-기타  { background: var(--tag-기타); }

.t-총괄  { background: rgba(59,130,246,0.15);  color:#93c5fd; border:1px solid rgba(59,130,246,0.3); }
.t-기획  { background: rgba(139,92,246,0.15); color:#c4b5fd; border:1px solid rgba(139,92,246,0.3); }
.t-공통  { background: rgba(6,182,212,0.15);  color:#67e8f9; border:1px solid rgba(6,182,212,0.3); }
.t-인프라{ background: rgba(14,165,233,0.15); color:#7dd3fc; border:1px solid rgba(14,165,233,0.3); }
.t-LMS   { background: rgba(16,185,129,0.15); color:#6ee7b7; border:1px solid rgba(16,185,129,0.3); }
.t-학사  { background: rgba(245,158,11,0.15); color:#fcd34d; border:1px solid rgba(245,158,11,0.3); }
.t-행정  { background: rgba(239,68,68,0.15);  color:#fca5a5; border:1px solid rgba(239,68,68,0.3); }
.t-연구  { background: rgba(236,72,153,0.15); color:#f9a8d4; border:1px solid rgba(236,72,153,0.3); }
.t-기타  { background: rgba(107,114,128,0.15);color:#d1d5db; border:1px solid rgba(107,114,128,0.3); }

/* ── 범례 ── */
.legend {
  margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.legend-title { font-size: 11px; color: var(--muted); margin-right:8px; letter-spacing:1px; }

/* ── 조직 트리 (상위→하위 시각화) ── */
.org-tree {
  margin-bottom: 24px;
}
.org-root {
  display: flex; flex-direction: column; align-items: flex-start; gap:0;
}
.tree-top {
  background: linear-gradient(135deg, #1e3a5f, #162d4a);
  border: 1px solid rgba(59,130,246,0.5);
  border-radius: 8px; padding: 10px 20px;
  display: inline-flex; align-items: center; gap: 12px;
  font-weight: 700; font-size: 15px;
  box-shadow: 0 0 20px rgba(59,130,246,0.15);
  margin-bottom: 0;
}
.tree-connector {
  width: 2px; height: 20px;
  background: linear-gradient(to bottom, rgba(59,130,246,0.5), rgba(59,130,246,0.1));
  margin-left: 30px;
}
.tree-branches {
  display: flex; flex-wrap: wrap; gap: 12px;
  padding-left: 0;
  position: relative;
}
.tree-branches::before {
  content:''; position:absolute; top:0; left:30px;
  width: calc(100% - 30px); height: 1px;
  background: linear-gradient(to right, rgba(59,130,246,0.3), transparent);
}

/* 반응형 */
@media (max-width: 768px) {
  .header { padding: 20px; }
  .main   { padding: 20px; }
  .dept-grid { grid-template-columns: 1fr; }
  .panel-univ { font-size: 20px; }
  .panel-total .num { font-size: 28px; }
}
</style>

      { name: '데이터혁신과',총괄:1, 기획:0, 공통:1, 인프라:0, LMS:0, 학사:0, 행정:1, 연구:0, 기타:0 }
    ]
  },
  {
    id: 'inha', name: '인하대', dept: '정보통신처',
    teams: [
      { name: 'IT개발팀',   총괄:1, 기획:0, 공통:0, 인프라:0, LMS:0, 학사:0, 행정:0, 연구:0, 기타:6 },
      { name: 'IT서비스팀', 총괄:1, 기획:0, 공통:5, 인프라:0, LMS:0, 학사:0, 행정:0, 연구:0, 기타:0 },
      { name: 'IT인프라팀', 총괄:1, 기획:0, 공통:0, 인프라:3, LMS:0, 학사:0, 행정:0, 연구:0, 기타:0 }
    ]
  }
];

const FIELDS = ['총괄','기획','공통','인프라','LMS','학사','행정','연구','기타'];
const COLORS = {
  총괄:'#3b82f6', 기획:'#8b5cf6', 공통:'#06b6d4', 인프라:'#0ea5e9',
  LMS:'#10b981', 학사:'#f59e0b', 행정:'#ef4444', 연구:'#ec4899', 기타:'#6b7280'
};

function totalOf(team) {
  return FIELDS.reduce((s,f)=> s + (team[f]||0), 0);
}

function univTotal(univ) {
  return univ.teams.reduce((s,t)=> s + totalOf(t), 0);
}

// ── 탭 렌더 ───────────────────────────────────────────────────────────
function renderTabs() {
  const tabs = document.getElementById('tabs');
  UNIVERSITIES.forEach((u, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i===0?' active':'');
    btn.textContent = u.name;
    btn.dataset.id = u.id;
    btn.onclick = () => showPanel(u.id);
    tabs.appendChild(btn);
  });
}

// ── 조직도 패널 렌더 ─────────────────────────────────────────────────
function renderPanels() {
  const main = document.getElementById('main');
  UNIVERSITIES.forEach((u, i) => {
    const panel = document.createElement('div');
    panel.className = 'org-panel' + (i===0?' active':'');
    panel.id = 'panel-' + u.id;
    panel.innerHTML = buildPanel(u);
    main.appendChild(panel);
  });
}

function buildPanel(u) {
  const tot = univTotal(u);
  // 전체 합계 태그
  const totalByField = {};
  FIELDS.forEach(f => {
    totalByField[f] = u.teams.reduce((s,t)=> s+(t[f]||0), 0);
  });

  const sumTags = FIELDS
    .filter(f => totalByField[f] > 0)
    .map(f => `<span class="tag t-${f}"><span>${f}</span><span class="cnt">${totalByField[f]}</span></span>`)
    .join('');

  // 트리 구조
  const treeTop = `
    <div class="tree-top">
      <span>${u.dept}</span>
      <span class="tag t-총괄" style="font-size:12px;">${tot}명</span>
    </div>`;

  const branchCards = u.teams.map(t => buildDeptCard(t, tot)).join('');

  return `
    <div class="panel-header">
      <div>
        <div class="panel-univ">${u.name}</div>
        <div class="panel-dept" style="margin-top:6px;">${u.dept}</div>
      </div>
      <div class="panel-total">
        <div class="num">${tot}</div>
        <div class="label">총 인원</div>
      </div>
    </div>

    <div class="org-tree">
      <div class="org-root">
        ${treeTop}
        <div class="tree-connector"></div>
        <div class="tree-branches">
          ${branchCards}
        </div>
      </div>
    </div>

    <div class="summary-bar">
      <span class="bar-label">전체 합계</span>
      ${sumTags}
    </div>

    <div class="legend">
      <span class="legend-title">업무 분류</span>
      ${FIELDS.map(f=>`<span class="tag t-${f}" style="font-size:11px;">${f}</span>`).join('')}
    </div>`;
}

function buildDeptCard(team, univTotal) {
  const tot = totalOf(team);
  const pct = univTotal > 0 ? Math.round(tot/univTotal*100) : 0;

  // 업무 태그 (값>0만)
  const tags = FIELDS
    .filter(f => team[f] > 0)
    .map(f => `<span class="tag t-${f}"><span>${f}</span><span class="cnt">${team[f]}</span></span>`)
    .join('');

  // 비율 바
  const barSegs = FIELDS
    .filter(f => team[f] > 0)
    .map(f => {
      const w = tot > 0 ? (team[f]/tot*100).toFixed(1) : 0;
      return `<div class="dept-bar-seg c-${f}" style="width:${w}%;"></div>`;
    }).join('');

  const noteHtml = team.note
    ? `<div style="padding:0 18px 10px; font-size:11px; color:var(--muted);">※ ${team.note}</div>`
    : '';

  return `
    <div class="dept-card">
      <div class="dept-bar">${barSegs}</div>
      <div class="dept-card-header">
        <div class="dept-name">${team.name}</div>
        <div class="dept-total">${tot}<span>명</span></div>
      </div>
      <div class="dept-tags">${tags || '<span style="color:var(--muted);font-size:12px;">-</span>'}</div>
      ${noteHtml}
    </div>`;
}

function showPanel(id) {
  document.querySelectorAll('.org-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  document.querySelector(`.tab[data-id="${id}"]`).classList.add('active');
}

// ── 초기화 ────────────────────────────────────────────────────────────
renderTabs();
renderPanels();
</script>
</body>
</html>
